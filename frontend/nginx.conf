server {
    listen 80;
    root /usr/share/nginx/html;

    # 해시가 붙은 빌드 파일은 오래 캐시한다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /week 같은 화면 경로로 바로 들어와도 index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
