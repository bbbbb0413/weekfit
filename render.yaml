# Render Blueprint. 대시보드의 New > Blueprint 에서 이 저장소를 고르면 아래 서비스가 만들어진다.
# sync: false 항목은 비밀값이라 처음 만들 때 대시보드에서 직접 입력한다.
services:
  - type: web
    name: weekfit-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      # Supabase > Connect > Session pooler 의 주소. jdbc:postgresql://<host>:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # Session pooler 사용자명은 postgres.<project-ref> 형태
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      # Supabase > Storage > S3 Configuration 의 Endpoint. https://<project-ref>.storage.supabase.co/storage/v1/s3
      - key: STORAGE_ENDPOINT
        sync: false
      # Supabase 프로젝트 리전(Storage > Settings > S3 Configuration). 지금 프로젝트는 도쿄
      - key: STORAGE_REGION
        value: ap-northeast-1
      - key: STORAGE_BUCKET
        value: modi
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # Vercel 배포 주소. 쉼표로 여러 개, https://weekfit-*.vercel.app 같은 패턴도 가능
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_SEED
        value: "true"
