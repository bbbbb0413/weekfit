spring:
  application:
    name: weekfit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/weekfit}
    username: ${DB_USERNAME:weekfit}
    password: ${DB_PASSWORD:weekfit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  ai:
    # 채팅 모델 선택은 application.properties 의 spring.ai.model.chat (AI_PROVIDER) 로 한다.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5-5}
          max-tokens: 16000
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

weekfit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:18333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:clothes}
    access-key: ${STORAGE_ACCESS_KEY:local}
    secret-key: ${STORAGE_SECRET_KEY:local}
