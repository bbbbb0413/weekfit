spring:
  application:
    name: modi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/weekfit}
    username: ${DB_USERNAME:weekfit}
    password: ${DB_PASSWORD:weekfit}
    hikari:
      # Supabase 무료 플랜 풀러의 연결 수 한도를 넘지 않도록 작게 둔다
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  ai:
    # 채팅 모델 선택은 application.properties 의 spring.ai.model.chat (AI_PROVIDER) 로 한다.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5-5}
          max-tokens: 16000
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

modi:
  shopping:
    # 제품 추천 전용 모델. 6건 비교에서 Opus 와 품질이 같고 비용이 약 25% 낮아 Sonnet 을 기본으로 둔다. 비우면 ANTHROPIC_MODEL 을 쓴다
    find-model: ${SHOPPING_FIND_MODEL:claude-sonnet-5-5}
  demo:
    seed: ${DEMO_SEED:true}
  rate-limit:
    ai-requests-per-hour: ${AI_RATE_LIMIT_PER_HOUR:60}
    find-requests-per-hour: ${FIND_RATE_LIMIT_PER_HOUR:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:18333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:clothes}
    access-key: ${STORAGE_ACCESS_KEY:local}
    secret-key: ${STORAGE_SECRET_KEY:local}
