openapi: 3.1.0
info:
  title: Weekfit API
  version: 0.1.0
  description: |
    일정·날씨·세탁 상태를 함께 읽고 코디를 추천하는 옷장 에이전트 백엔드 API.

    - 모든 응답은 `{ success, data, error }` envelope 으로 감싼다. 아래 스키마의 `data` 가 실제 내용이다.
    - 사용자 식별은 `X-User-Id` 헤더(UUID)로 한다. 헤더가 없으면 데모 사용자(`00000000-0000-0000-0000-000000000001`)로 처리한다.
      브라우저마다 UUID 를 한 번 만들어 저장해 두고 매 요청에 보내는 방식을 권장한다.
    - 날짜는 `YYYY-MM-DD`, 일시는 ISO-8601(`2026-11-22T14:00:00+09:00`)이다. 기준 시간대는 Asia/Seoul 이다.
    - AI 를 호출하는 POST 엔드포인트는 IP 당 시간당 요청 수가 제한된다(429).
servers:
  - url: http://localhost:8080
    description: 로컬
tags:
  - name: closet
    description: 옷장 (등록·조회·상태·세탁·보유 검사)
  - name: wear
    description: 착용 기록과 체감 피드백
  - name: weather
    description: 날씨 (배경 표시·추천 입력)
  - name: events
    description: 일정 (구글 캘린더 동기화·직접 입력)
  - name: plans
    description: 캘린더 기반 코디 추천
  - name: outfits
    description: 옷 평가
  - name: shopping
    description: 사진으로 가성비 옷 찾기
  - name: images
    description: 저장된 이미지

paths:
  /api/clothes/analyze:
    post:
      tags: [closet]
      summary: 옷 사진 업로드 + AI 태깅 제안
      description: |
        사진을 저장하고 AI 가 추정한 속성을 돌려준다. 이 단계에서는 옷장에 저장되지 않는다.
        사용자가 제안값을 확인·수정한 뒤 `POST /api/clothes` 로 저장한다.
        AI 호출에 실패하면 `aiAvailable=false` 와 빈 제안을 돌려주며, 이때는 사용자가 직접 입력한다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPEG 또는 PNG, 10MB 이하' }
      responses:
        '200': { $ref: '#/components/responses/ClothingAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/clothes:
    get:
      tags: [closet]
      summary: 옷 목록
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: status, in: query, description: '현재 시점의 실제 상태(effective) 기준 필터', schema: { $ref: '#/components/schemas/ItemStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Clothing' } } }
    post:
      tags: [closet]
      summary: 옷 저장
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClothingCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/clothes/{id}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [closet]
      summary: 옷 단건 조회
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [closet]
      summary: 옷 속성 수정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClothingSpec' }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [closet]
      summary: 옷 삭제
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clothes/{id}/status:
    patch:
      tags: [closet]
      summary: 옷 상태 수동 변경
      description: '`DRYING` 은 `POST /api/laundry` 로만 들어간다.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, LAUNDRY, REPAIR] }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/laundry:
    post:
      tags: [closet]
      summary: 세탁 시작
      description: 지정한 옷을 `DRYING` 으로 바꾸고 착용 횟수를 0으로 되돌린다. `dryUntil` 이 지나면 자동으로 `AVAILABLE` 로 보인다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                dryHours: { type: integer, minimum: 1, maximum: 96, description: '생략하면 종류별 기본값(아우터 48시간, 그 외 24시간)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Clothing' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clothes/similar-check:
    post:
      tags: [closet]
      summary: 비슷한 옷 보유 검사
      description: 사려는 옷의 사진을 올리면 옷장에 비슷한 옷이 있는지와, 함께 입을 수 있는 내 옷의 수를 알려준다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/SimilarCheckResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/wear-logs:
    get:
      tags: [wear]
      summary: 착용 기록 조회
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/WearLog' } } }
    post:
      tags: [wear]
      summary: 입은 옷 기록 (캐릭터에 입힌 조합 확정)
      description: 각 옷의 착용 횟수를 올린다. `feedback` 을 보내면 개인 보온 기준이 조정되어 다음 추천에 반영된다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WearLogRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WearLog' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/weather:
    get:
      tags: [weather]
      summary: 현재·시간별·주간 날씨
      description: 배경 표시는 `current.condition` 을 쓴다. 좌표를 생략하면 서울 기준이다. 30분 캐시한다.
      parameters:
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90, default: 37.5665 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180, default: 126.978 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WeatherReport' } }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/events/mask-preview:
    post:
      tags: [events]
      summary: AI 에 보낼 일정 텍스트 미리보기 (개인정보 마스킹)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, example: '민지 결혼식 010-1234-5678' }
                location: { type: string, example: '더채플 청담' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          title: { type: string, example: '[이름] 결혼식 [전화번호]' }
                          location: { type: [string, 'null'] }
                          maskedCount: { type: integer, description: '가려진 항목 수' }

  /api/events/sync:
    put:
      tags: [events]
      summary: 구글 캘린더 일정 동기화
      description: |
        프론트가 구글 캘린더에서 받아 온 일정을 보낸다. `externalId` 기준으로 추가·갱신하며, 요청 기간 안에 있던 기존 일정 중
        목록에 없는 것은 삭제한다. 제목·장소는 마스킹 후 저장하고 분석한다. 원문은 저장하지 않는다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, events]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                events: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EventInput' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/events:
    get:
      tags: [events]
      summary: 일정 목록
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } }
    post:
      tags: [events]
      summary: 일정 직접 입력
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/CalendarEvent' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/events/{id}:
    delete:
      tags: [events]
      summary: 일정 삭제
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/plans/week:
    get:
      tags: [plans]
      summary: 7일 코디 계획 + 세탁 역산
      description: |
        `start` 부터 7일간 일정·예보·옷 상태를 읽어 하루 한 벌씩 배정한다. 중요한 일정(면접·결혼식 등)에 쓸 옷을 먼저 예약하고,
        예약된 옷이 그날까지 세탁·건조되어야 하면 `laundryTasks` 에 마감 시각을 넣는다.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WeekPlan' } }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/plans/day:
    post:
      tags: [plans]
      summary: 하루 추천 (꼭 입을 옷 1벌 고정 가능)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                anchorItemId: { type: string, format: uuid, description: '반드시 포함할 옷' }
                tpo: { $ref: '#/components/schemas/Tpo' }
                lat: { type: number }
                lon: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/DayPlan' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/outfits/evaluate:
    post:
      tags: [outfits]
      summary: 옷 평가 (캐릭터에 입힌 조합)
      description: |
        날씨·일정(TPO)·색 조합·세탁 상태를 항목별로 점수화하고 총점과 교체 제안을 돌려준다.
        `eventId` 를 주면 그 일정 기준, 아니면 `tpo` 기준, 둘 다 없으면 그날 가장 중요한 일정 기준으로 평가한다.
        AI 실패 시 색 조합 항목과 총평은 규칙 기반으로 채우고 `aiAvailable=false` 로 표시한다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                date: { type: string, format: date, description: '생략하면 오늘' }
                eventId: { type: string, format: uuid }
                tpo: { $ref: '#/components/schemas/Tpo' }
                lat: { type: number }
                lon: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/OutfitEvaluation' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/shopping/similar:
    post:
      tags: [shopping]
      summary: 사진으로 가성비 옷 찾기
      description: 사진 속 옷의 속성을 분석해 검색어를 만들고, 여러 쇼핑몰의 비슷한 상품을 쇼핑몰별 최저가로 정리한다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                maxPrice: { type: integer, minimum: 1000, description: '원 단위 상한' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ShoppingResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/images/{key}:
    get:
      tags: [images]
      summary: 옷 이미지
      description: '`Clothing.imageUrl` 에 이 경로가 들어 있다.'
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]+$' } }
      responses:
        '200':
          description: 이미지 바이너리
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: false
      description: 사용자 UUID. 생략하면 데모 사용자.
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ClothingOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { $ref: '#/components/schemas/Clothing' } }
    ClothingAnalysis:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { $ref: '#/components/schemas/ClothingAnalysisResult' } }
    Empty:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { type: 'null' } }
    BadRequest:
      description: 요청 값 오류
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: 대상 없음
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooLarge:
      description: 이미지 용량 초과
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: 요청 한도 초과. 잠시 뒤 다시 시도한다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unavailable:
      description: 외부 서비스(AI·날씨·쇼핑 검색) 일시 장애
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    Envelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: {}
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { type: string, example: '옷을 찾을 수 없습니다.' }

    Category:
      type: string
      enum: [TOP, BOTTOM, OUTER, DRESS, SHOES, ACCESSORY]
      description: 상의, 하의, 아우터, 원피스, 신발, 액세서리
    ItemStatus:
      type: string
      enum: [AVAILABLE, LAUNDRY, DRYING, REPAIR]
      description: 입을 수 있음, 세탁 대기, 건조 중, 수선 중
    Color:
      type: string
      enum: [블랙, 화이트, 그레이, 네이비, 블루, 베이지, 브라운, 카키, 그린, 레드, 핑크, 퍼플, 옐로, 오렌지, 멀티]
    Style:
      type: string
      enum: [캐주얼, 미니멀, 포멀, 스포티, 스트릿, 빈티지, 페미닌, 아웃도어]
    Tpo:
      type: string
      enum: [DAILY, WORK, FORMAL, DATE, OUTDOOR, EXERCISE]
      description: 일상, 출근, 격식, 데이트, 야외활동, 운동
    WeatherCondition:
      type: string
      enum: [CLEAR, CLOUDY, FOG, RAIN, SNOW, THUNDER]
    ThermalFeedback:
      type: string
      enum: [COLD, OK, HOT]

    ClothingSpec:
      type: object
      required: [category, colors, warmth, styles, formality]
      properties:
        name: { type: [string, 'null'], maxLength: 100, example: '네이비 옥스포드 셔츠' }
        category: { $ref: '#/components/schemas/Category' }
        subType: { type: [string, 'null'], maxLength: 50, example: '셔츠' }
        colors: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: integer, minimum: 1, maximum: 5, description: '1 매우 얇음 ~ 5 매우 따뜻함' }
        styles: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: integer, minimum: 1, maximum: 5, description: '1 운동복 ~ 5 정장' }
        washThreshold: { type: [integer, 'null'], minimum: 1, maximum: 30, description: '몇 번 입으면 세탁 권장인지. 생략하면 종류별 기본값' }
    ClothingCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ClothingSpec'
        - type: object
          properties:
            imageKey: { type: [string, 'null'], description: '`/api/clothes/analyze` 응답의 imageKey' }
    ClothingSuggestion:
      type: object
      description: AI 추정값. 값을 알 수 없으면 null.
      properties:
        name: { type: [string, 'null'] }
        category: { oneOf: [{ $ref: '#/components/schemas/Category' }, { type: 'null' }] }
        subType: { type: [string, 'null'] }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: [integer, 'null'] }
        styles: { type: array, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: [integer, 'null'] }
        washThreshold: { type: [integer, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        lowConfidence: { type: boolean, description: 'true 면 저장 전 사용자 확인을 강하게 유도한다' }
        description: { type: [string, 'null'], example: '면 소재의 기본 핏 네이비 셔츠' }
    ClothingAnalysisResult:
      type: object
      properties:
        imageKey: { type: string }
        imageUrl: { type: string, example: '/api/images/3f6c....jpg' }
        aiAvailable: { type: boolean }
        suggestion: { $ref: '#/components/schemas/ClothingSuggestion' }
    Clothing:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        subType: { type: [string, 'null'] }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: integer }
        styles: { type: array, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: integer }
        status: { $ref: '#/components/schemas/ItemStatus', description: '현재 시점 기준 실제 상태' }
        needsWash: { type: boolean, description: '착용 횟수가 세탁 기준에 도달함 (세탁 권장 배지)' }
        wearsSinceWash: { type: integer }
        washThreshold: { type: integer }
        dryUntil: { type: [string, 'null'], format: date-time }
        lastWornOn: { type: [string, 'null'], format: date }

    WearLogRequest:
      type: object
      required: [date, itemIds]
      properties:
        date: { type: string, format: date }
        itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        feedback: { $ref: '#/components/schemas/ThermalFeedback' }
    WearLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        itemIds: { type: array, items: { type: string, format: uuid } }
        feedback: { oneOf: [{ $ref: '#/components/schemas/ThermalFeedback' }, { type: 'null' }] }
        warmthBias: { type: integer, minimum: -2, maximum: 2, description: '반영 후 개인 보온 보정값' }

    WeatherReport:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        current:
          type: object
          properties:
            time: { type: string, format: date-time }
            temperature: { type: number }
            apparentTemperature: { type: number }
            precipitationProbability: { type: integer }
            windSpeed: { type: number, description: 'km/h' }
            condition: { $ref: '#/components/schemas/WeatherCondition' }
        hourly:
          type: array
          description: 현재 시각부터 24시간
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              temperature: { type: number }
              apparentTemperature: { type: number }
              precipitationProbability: { type: integer }
              condition: { $ref: '#/components/schemas/WeatherCondition' }
        daily:
          type: array
          description: 오늘부터 7일
          items: { $ref: '#/components/schemas/DailyWeather' }
    DailyWeather:
      type: object
      properties:
        date: { type: string, format: date }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        temperatureMin: { type: number }
        temperatureMax: { type: number }
        apparentMin: { type: number }
        apparentMax: { type: number }
        precipitationProbabilityMax: { type: integer }

    EventInput:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        externalId: { type: [string, 'null'], description: '구글 캘린더 event id (동기화 시 필수)' }
        title: { type: string, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'], maxLength: 200 }
    EventAnalysis:
      type: object
      properties:
        tpo: { $ref: '#/components/schemas/Tpo' }
        formality: { type: integer, minimum: 1, maximum: 5 }
        dressCode: { type: [string, 'null'], example: '하객 세미정장' }
        avoidColors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        indoor: { type: [boolean, 'null'] }
        activityLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        importance: { type: integer, minimum: 1, maximum: 5, description: '높을수록 그날 코디에서 우선한다' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, enum: [AI, RULE, SEED] }
        clarifyQuestion: { type: [string, 'null'], description: "신뢰도가 낮을 때 사용자에게 물을 질문. 예: '북한산은 등산 일정인가요?'" }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: [string, 'null'] }
        title: { type: string, description: 마스킹된 제목 }
        location: { type: [string, 'null'], description: 마스킹된 장소 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        analysis: { $ref: '#/components/schemas/EventAnalysis' }

    OutfitSlot:
      type: string
      enum: [TOP, BOTTOM, DRESS, OUTER, SHOES]
    Outfit:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              slot: { $ref: '#/components/schemas/OutfitSlot' }
              item: { $ref: '#/components/schemas/Clothing' }
        warmth: { type: integer, description: '조합 보온 점수(1~5)' }
    DayPlan:
      type: object
      properties:
        date: { type: string, format: date }
        tpo: { $ref: '#/components/schemas/Tpo' }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              tpo: { $ref: '#/components/schemas/Tpo' }
        weather: { oneOf: [{ $ref: '#/components/schemas/DailyWeather' }, { type: 'null' }] }
        requiredWarmth: { type: integer, minimum: 1, maximum: 5 }
        outfit: { oneOf: [{ $ref: '#/components/schemas/Outfit' }, { type: 'null' }], description: '조합을 만들 수 없으면 null' }
        reason: { type: string, example: '토요일 결혼식이라 흰색을 피해 네이비 셔츠를 골랐어요.' }
        layeringTip: { type: [string, 'null'], example: '아침 3℃, 낮 14℃라 낮에 벗을 수 있는 가디건을 더했어요.' }
        warnings: { type: array, items: { type: string } }
    LaundryTask:
      type: object
      properties:
        itemIds: { type: array, items: { type: string, format: uuid } }
        itemNames: { type: array, items: { type: string } }
        deadline: { type: string, format: date-time, description: '이 시각까지 세탁을 시작해야 그날 마른다' }
        forDate: { type: string, format: date }
        reason: { type: string }
    WeekPlan:
      type: object
      properties:
        startDate: { type: string, format: date }
        days: { type: array, items: { $ref: '#/components/schemas/DayPlan' } }
        laundryTasks: { type: array, items: { $ref: '#/components/schemas/LaundryTask' } }
        conflicts: { type: array, items: { type: string }, description: '마감이 이미 지나 세탁이 불가능한 경우 등' }
        aiAvailable: { type: boolean, description: 'false 면 설명이 규칙 템플릿 문장이다' }

    EvaluationCheck:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        ok: { type: boolean }
        message: { type: string }
    OutfitEvaluation:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        grade: { type: string, enum: [GREAT, GOOD, FAIR, POOR] }
        checks:
          type: object
          properties:
            weather: { $ref: '#/components/schemas/EvaluationCheck' }
            tpo: { $ref: '#/components/schemas/EvaluationCheck' }
            color: { $ref: '#/components/schemas/EvaluationCheck' }
            laundry: { $ref: '#/components/schemas/EvaluationCheck' }
        summary: { type: string }
        suggestions:
          type: array
          items:
            type: object
            properties:
              replaceItemId: { type: [string, 'null'], format: uuid, description: '바꿀 옷. 옷을 더하라는 제안이면 null' }
              withItemId: { type: [string, 'null'], format: uuid, description: '대신 입을 내 옷. 옷장에 대안이 없으면 null' }
              reason: { type: string }
        warnings: { type: array, items: { type: string }, description: '세탁 필요·수선 중 등 입기 전에 확인할 사항' }
        aiAvailable: { type: boolean, description: 'false 면 summary 가 규칙 템플릿 문장이다' }

    SimilarCheckResult:
      type: object
      properties:
        attributes: { $ref: '#/components/schemas/ClothingSuggestion' }
        verdict: { type: string, enum: [DUPLICATE, SIMILAR, NEW], description: '거의 같은 옷 보유, 비슷한 옷 보유, 새로운 옷' }
        matches:
          type: array
          description: 유사도 높은 순 최대 3개
          items:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Clothing' }
              similarity: { type: number, minimum: 0, maximum: 1 }
              reasons: { type: array, items: { type: string }, example: ['같은 셔츠', '색 일치: 네이비'] }
        pairableCount: { type: integer, description: '이 옷과 함께 입을 수 있는 내 옷 수' }
        comment: { type: string }

    ShoppingProduct:
      type: object
      properties:
        title: { type: string }
        price: { type: integer, description: 원 }
        mallName: { type: string }
        brand: { type: [string, 'null'] }
        link: { type: string, format: uri }
        imageUrl: { type: string, format: uri }
    ShoppingResult:
      type: object
      properties:
        attributes: { $ref: '#/components/schemas/ClothingSuggestion' }
        query: { type: string, example: '네이비 오버핏 니트 가디건' }
        products: { type: array, description: '쇼핑몰별 최저가 1개씩, 가격 오름차순', items: { $ref: '#/components/schemas/ShoppingProduct' } }
        mallCount: { type: integer }
        minPrice: { type: [integer, 'null'] }
        medianPrice: { type: [integer, 'null'] }
