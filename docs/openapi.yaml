openapi: 3.1.0
info:
  title: Modi API
  version: 0.1.0
  description: |
    일정·날씨·세탁 상태를 함께 읽고 코디를 추천하는 옷장 에이전트 백엔드 API.

    - 모든 응답은 `{ success, data, error }` envelope 으로 감싼다. 아래 스키마의 `data` 가 실제 내용이다.
    - 사용자 식별은 `X-User-Id` 헤더(UUID)로 한다. 헤더가 없으면 데모 사용자(`00000000-0000-0000-0000-000000000001`)로 처리한다.
      브라우저마다 UUID 를 한 번 만들어 저장해 두고 매 요청에 보내는 방식을 권장한다.
    - 날짜는 `YYYY-MM-DD`, 일시는 ISO-8601(`2026-11-22T14:00:00+09:00`)이다. 기준 시간대는 Asia/Seoul 이다.
    - AI 를 호출하는 엔드포인트(POST, PUT 과 `GET /api/plans/week`)는 IP 당 시간 60회로 제한된다(429).
      웹 검색 제품 찾기(`/api/shopping/find`, `/api/shopping/look/find`)는 별도로 시간 10회 한도가 더 있다.
servers:
  - url: https://modi-api-ch95.onrender.com
    description: 배포 서버 (Render 무료 인스턴스, 잠들어 있으면 첫 응답이 1~3분 걸린다)
  - url: http://localhost:8080
    description: 로컬
tags:
  - name: closet
    description: 옷장 (등록·조회·상태·세탁·보유 검사)
  - name: wear
    description: 착용 기록과 체감 피드백
  - name: weather
    description: 날씨 (배경 표시·추천 입력)
  - name: events
    description: 일정 (구글 캘린더 동기화·직접 입력)
  - name: plans
    description: 캘린더 기반 코디 추천
  - name: outfits
    description: 옷 평가
  - name: shopping
    description: 가성비 옷 찾기, 살까 말까
  - name: avatar
    description: 아바타 옷 그림
  - name: ops
    description: 운영 (AI 사용량)
  - name: images
    description: 저장된 이미지

paths:
  /api/clothes/analyze:
    post:
      tags: [closet]
      summary: 옷 사진 업로드 + AI 태깅 제안
      description: |
        사진을 저장하고 AI 가 추정한 속성을 돌려준다. 이 단계에서는 옷장에 저장되지 않는다.
        사용자가 제안값을 확인·수정한 뒤 `POST /api/clothes` 로 저장한다.
        AI 호출에 실패하면 `aiAvailable=false` 와 빈 제안을 돌려주며, 이때는 사용자가 직접 입력한다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPEG 또는 PNG, 10MB 이하' }
      responses:
        '200': { $ref: '#/components/responses/ClothingAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/clothes:
    get:
      tags: [closet]
      summary: 옷 목록
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: status, in: query, description: '현재 시점의 실제 상태(effective) 기준 필터', schema: { $ref: '#/components/schemas/ItemStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Clothing' } } }
    post:
      tags: [closet]
      summary: 옷 저장
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClothingCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/clothes/{id}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [closet]
      summary: 옷 단건 조회
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [closet]
      summary: 옷 속성 수정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClothingSpec' }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [closet]
      summary: 옷 삭제
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clothes/{id}/avatar-paint:
    get:
      tags: [avatar]
      summary: 아바타 옷 그림
      description: |
        옷 사진, 이름, 종류, 색과 캐릭터의 관절 기준점을 AI 에 주고, 그 캐릭터가 입을 옷 한 벌만 투명 배경 SVG 로 받는다.
        옷 한 벌과 캐릭터 조합마다 한 번만 그리고 저장소에 보관한다. 옷 이름, 색, 사진이 바뀌면 다시 그린다.
        데모 옷장 옷은 미리 그려 둔 그림을 바로 돌려준다. 소품(ACCESSORY)은 그리지 않는다.
        AI 가 실패하거나 SVG 검사를 통과하지 못하면 `svg` 가 null 이고, 화면은 옷 색으로 칠한다.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
        - { name: model, in: query, required: false, schema: { type: string, enum: [mannequin, wave, hip, cross, modi], default: mannequin }, description: '캐릭터 모델' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/AvatarPaint' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clothes/{id}/status:
    patch:
      tags: [closet]
      summary: 옷 상태 수동 변경
      description: '`DRYING` 은 `POST /api/laundry` 로만 들어간다.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, LAUNDRY, REPAIR] }
      responses:
        '200': { $ref: '#/components/responses/ClothingOne' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/laundry:
    post:
      tags: [closet]
      summary: 세탁 시작
      description: 지정한 옷을 `DRYING` 으로 바꾸고 착용 횟수를 0으로 되돌린다. `dryUntil` 이 지나면 자동으로 `AVAILABLE` 로 보인다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                dryHours: { type: integer, minimum: 1, maximum: 96, description: '생략하면 종류별 기본값(아우터 48시간, 그 외 24시간)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Clothing' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clothes/similar-check:
    post:
      tags: [closet]
      summary: 비슷한 옷 보유 검사
      description: 사려는 옷의 사진을 올리면 옷장에 비슷한 옷이 있는지와, 함께 입을 수 있는 내 옷의 수를 알려준다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/SimilarCheckResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/wear-logs:
    get:
      tags: [wear]
      summary: 착용 기록 조회
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/WearLog' } } }
    post:
      tags: [wear]
      summary: 입은 옷 기록 (캐릭터에 입힌 조합 확정)
      description: 각 옷의 착용 횟수를 올린다. `feedback` 을 보내면 개인 보온 기준이 조정되어 다음 추천에 반영된다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WearLogRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WearLog' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/wear-logs/{id}:
    delete:
      tags: [wear]
      summary: 착용 기록 취소
      description: |
        기록 전으로 되돌린다. 옷마다 세탁 후 입은 횟수를 1 줄이고(0 아래로는 내려가지 않는다),
        마지막 착용일은 남은 다른 기록 중 가장 최근 날짜로 다시 정한다. 체감 피드백이 있던 기록이면 보온 보정값도 반대로 되돌린다.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/weather:
    get:
      tags: [weather]
      summary: 현재·시간별·주간 날씨
      description: 배경 표시는 `current.condition` 을 쓴다. 좌표를 생략하면 서울 기준이다. 30분 캐시한다.
      parameters:
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90, default: 37.5665 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180, default: 126.978 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WeatherReport' } }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/events/mask-preview:
    post:
      tags: [events]
      summary: AI 에 보낼 일정 텍스트 미리보기 (개인정보 마스킹)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, example: '민지 결혼식 010-1234-5678' }
                location: { type: string, example: '더채플 청담' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          title: { type: string, example: '[이름] 결혼식 [전화번호]' }
                          location: { type: [string, 'null'] }
                          maskedCount: { type: integer, description: '가려진 항목 수' }

  /api/events/sync:
    put:
      tags: [events]
      summary: 구글 캘린더 일정 동기화
      description: |
        프론트가 구글 캘린더에서 받아 온 일정을 보낸다. `externalId` 기준으로 추가·갱신하며, 요청 기간 안에 있던 기존 일정 중
        목록에 없는 것은 삭제한다. 제목·장소는 마스킹 후 저장하고 분석한다. 원문은 저장하지 않는다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, events]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                events: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EventInput' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/events:
    get:
      tags: [events]
      summary: 일정 목록
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } }
    post:
      tags: [events]
      summary: 일정 직접 입력
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/CalendarEvent' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/events/{id}:
    delete:
      tags: [events]
      summary: 일정 삭제
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/plans/week:
    get:
      tags: [plans]
      summary: 7일 코디 계획 + 세탁 역산
      description: |
        `start` 부터 7일간 일정·예보·옷 상태를 읽어 하루 한 벌씩 배정한다. 중요한 일정(면접·결혼식 등)에 쓸 옷을 먼저 예약하고,
        예약된 옷이 그날까지 세탁·건조되어야 하면 `laundryTasks` 에 마감 시각을 넣는다.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/WeekPlan' } }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/plans/day:
    post:
      tags: [plans]
      summary: 하루 추천 (꼭 입을 옷 1벌 고정 가능)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                anchorItemId: { type: string, format: uuid, description: '반드시 포함할 옷' }
                tpo: { $ref: '#/components/schemas/Tpo' }
                lat: { type: number }
                lon: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/DayPlan' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/outfits/evaluate:
    post:
      tags: [outfits]
      summary: 옷 평가 (캐릭터에 입힌 조합)
      description: |
        날씨·일정(TPO)·색 조합·세탁 상태를 항목별로 점수화하고 총점과 교체 제안을 돌려준다.
        `eventId` 를 주면 그 일정 기준, 아니면 `tpo` 기준, 둘 다 없으면 그날 가장 중요한 일정 기준으로 평가한다.
        AI 실패 시 색 조합 항목과 총평은 규칙 기반으로 채우고 `aiAvailable=false` 로 표시한다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                date: { type: string, format: date, description: '생략하면 오늘' }
                eventId: { type: string, format: uuid }
                tpo: { $ref: '#/components/schemas/Tpo' }
                lat: { type: number }
                lon: { type: number }
                ai: { type: boolean, default: true, description: 'false 면 AI 를 부르지 않고 규칙 점수만 돌려준다' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/OutfitEvaluation' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/shopping/similar:
    post:
      tags: [shopping]
      summary: 사진으로 가성비 옷 찾기
      description: |
        사진 속 옷을 분석해 검색어를 만들고, 쇼핑몰 5곳의 검색 결과 링크를 돌려준다. 패션 전문몰 4곳은 낮은 가격순, 11번가는 인기순이다.
        상품 가격은 서버가 모른다(네이버 쇼핑 API 종료). 프론트는 query 를 보여 주고 사용자가 고치면 GET /api/shopping/links 로 다시 만든다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ShoppingResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/shopping/links:
    get:
      tags: [shopping]
      summary: 검색어로 쇼핑몰 링크 다시 만들기
      description: AI 를 호출하지 않는다. attributes 는 null 이다.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: query, in: query, required: true, schema: { type: string, maxLength: 50 }, example: '네이비 울 롱코트' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' }, description: '주면 무신사 링크에 카테고리 필터를 붙인다. 사진 분석 결과의 attributes.category 를 넘기면 된다' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/ShoppingResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/shopping/find:
    post:
      tags: [shopping]
      summary: 가성비 제품 찾기(AI 웹 검색)
      description: |
        사진이나 텍스트 속 옷과 비슷하면서 더 싼 실제 제품을 최대 2개 찾는다. 쇼핑몰을 두 묶음으로 나눠 동시에 검색하며 한 번에 20~30초 걸린다.
        조건에 맞는 제품이 없으면 검색어를 바꿔 처음 시도를 포함해 최대 5번까지 찾는다. 다시 찾을 때는 앞서 실패한 검색어를 알려 주고 세부 조건을 빼서 넓게 찾는다.
        AI 가 실패하거나 제품을 못 찾아도 200 으로 쇼핑몰 검색 링크(fallbackLinks)를 돌려준다. IP 당 시간 10회로 제한한다.
        제품을 찾은 결과만 같은 사진, 텍스트 요청에 30분 동안 다시 쓴다. 못 찾은 결과는 캐시하지 않는다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: image 와 text 중 하나는 있어야 한다
              properties:
                image: { type: string, format: binary, description: '옷만 나온 사진이나 상품 캡처. 얼굴이 나오지 않게 한다' }
                text: { type: string, maxLength: 300, example: '폴로 랄프로렌 케이블 니트 베스트 네이비 비슷한데 더 싼 거' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/FindResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/shopping/look:
    post:
      tags: [shopping]
      summary: '살까 말까: 코디 사진을 부위별 카드로'
      description: |
        코디 사진 한 장을 AI 한 번 호출로 겉옷, 상의(또는 원피스), 하의, 신발 카드 최대 4장으로 나눈다. 가방, 모자 같은 소품은 넣지 않는다.
        카드마다 상품명, 특징, 사진 속 위치, 속성, 검색어가 있다. 옷장 비교는 AI 를 다시 부르지 않고 유사도 규칙으로 하며,
        거의 같은 옷(유사도 0.85 이상)이 있을 때만 `duplicate` 를 채운다. 사진은 저장하지 않는다.
        AI 가 실패하면 200 으로 빈 `pieces` 와 `aiAvailable=false` 를 돌려준다.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/LookResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/shopping/look/find:
    post:
      tags: [shopping]
      summary: '살까 말까: 카드 하나의 가성비 제품 찾기'
      description: |
        카드의 검색어 후보를 최대 3개까지 차례로 써 본다. 사진은 첫 검색어에만 함께 보내고, 검색어마다 `/api/shopping/find` 의 재시도가 함께 돈다.
        제품이 나오거나 AI 를 쓸 수 없으면 바로 멈춘다. 요청 제한은 1회로 센다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [queries]
              properties:
                image: { type: string, format: binary, description: '카드 사진(선택)' }
                queries: { type: string, description: '검색어 후보. 줄바꿈으로 구분한다(검색어 안의 쉼표가 나뉘지 않게). 앞의 3개만 쓰고 각 300자까지', example: "울 혼방 더블 브레스티드 롱코트\n그레이 롱코트" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/FindResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/images/{key}:
    get:
      tags: [images]
      summary: 옷 이미지
      description: '`Clothing.imageUrl` 에 이 경로가 들어 있다.'
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]+$' } }
      responses:
        '200':
          description: 이미지 바이너리
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/ai-usage:
    get:
      tags: [ops]
      summary: AI 사용량
      description: 서버가 켜진 뒤 기능별 AI 호출 횟수, 실패 수, 입력과 출력 토큰, 최근 호출 30건. 메모리에만 두므로 재시작하면 0부터 다시 센다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/AiUsageReport' } }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: false
      description: 사용자 UUID. 생략하면 데모 사용자.
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ClothingOne:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { $ref: '#/components/schemas/Clothing' } }
    ClothingAnalysis:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { $ref: '#/components/schemas/ClothingAnalysisResult' } }
    Empty:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties: { data: { type: 'null' } }
    BadRequest:
      description: 요청 값 오류
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: 대상 없음
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooLarge:
      description: 이미지 용량 초과
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: 요청 한도 초과. 잠시 뒤 다시 시도한다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unavailable:
      description: 외부 서비스(AI·날씨·쇼핑 검색) 일시 장애
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    Envelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: {}
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { type: string, example: '옷을 찾을 수 없습니다.' }

    Category:
      type: string
      enum: [TOP, BOTTOM, OUTER, DRESS, SHOES, ACCESSORY]
      description: 상의, 하의, 아우터, 원피스, 신발, 액세서리
    ItemStatus:
      type: string
      enum: [AVAILABLE, LAUNDRY, DRYING, REPAIR]
      description: 입을 수 있음, 세탁 대기, 건조 중, 수선 중
    Color:
      type: string
      enum: [블랙, 화이트, 그레이, 네이비, 블루, 베이지, 브라운, 카키, 그린, 레드, 핑크, 퍼플, 옐로, 오렌지, 멀티]
    Style:
      type: string
      enum: [캐주얼, 미니멀, 포멀, 스포티, 스트릿, 빈티지, 페미닌, 아웃도어]
    Tpo:
      type: string
      enum: [DAILY, WORK, FORMAL, DATE, OUTDOOR, EXERCISE]
      description: 일상, 출근, 격식, 데이트, 야외활동, 운동
    WeatherCondition:
      type: string
      enum: [CLEAR, CLOUDY, FOG, RAIN, SNOW, THUNDER]
    ThermalFeedback:
      type: string
      enum: [COLD, OK, HOT]

    ClothingSpec:
      type: object
      required: [category, colors, warmth, styles, formality]
      properties:
        name: { type: [string, 'null'], maxLength: 100, example: '네이비 옥스포드 셔츠' }
        category: { $ref: '#/components/schemas/Category' }
        subType: { type: [string, 'null'], maxLength: 50, example: '셔츠' }
        colors: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: integer, minimum: 1, maximum: 5, description: '1 매우 얇음 ~ 5 매우 따뜻함' }
        styles: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: integer, minimum: 1, maximum: 5, description: '1 운동복 ~ 5 정장' }
        washThreshold: { type: [integer, 'null'], minimum: 1, maximum: 30, description: '몇 번 입으면 세탁 권장인지. 생략하면 종류별 기본값' }
    ClothingCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ClothingSpec'
        - type: object
          properties:
            imageKey: { type: [string, 'null'], description: '`/api/clothes/analyze` 응답의 imageKey' }
    ClothingSuggestion:
      type: object
      description: AI 추정값. 값을 알 수 없으면 null.
      properties:
        name: { type: [string, 'null'] }
        category: { oneOf: [{ $ref: '#/components/schemas/Category' }, { type: 'null' }] }
        subType: { type: [string, 'null'] }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: [integer, 'null'] }
        styles: { type: array, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: [integer, 'null'] }
        washThreshold: { type: [integer, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        lowConfidence: { type: boolean, description: 'true 면 저장 전 사용자 확인을 강하게 유도한다' }
        description: { type: [string, 'null'], example: '면 소재의 기본 핏 네이비 셔츠' }
    ClothingAnalysisResult:
      type: object
      properties:
        imageKey: { type: string }
        imageUrl: { type: string, example: '/api/images/3f6c....jpg' }
        aiAvailable: { type: boolean }
        suggestion: { $ref: '#/components/schemas/ClothingSuggestion' }
    Clothing:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        subType: { type: [string, 'null'] }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        warmth: { type: integer }
        styles: { type: array, items: { $ref: '#/components/schemas/Style' } }
        formality: { type: integer }
        status: { $ref: '#/components/schemas/ItemStatus', description: '현재 시점 기준 실제 상태' }
        needsWash: { type: boolean, description: '착용 횟수가 세탁 기준에 도달함 (세탁 권장 배지)' }
        wearsSinceWash: { type: integer }
        washThreshold: { type: integer }
        dryUntil: { type: [string, 'null'], format: date-time }
        lastWornOn: { type: [string, 'null'], format: date }

    WearLogRequest:
      type: object
      required: [date, itemIds]
      properties:
        date: { type: string, format: date }
        itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        feedback: { $ref: '#/components/schemas/ThermalFeedback' }
    WearLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        itemIds: { type: array, items: { type: string, format: uuid } }
        feedback: { oneOf: [{ $ref: '#/components/schemas/ThermalFeedback' }, { type: 'null' }] }
        warmthBias: { type: integer, minimum: -2, maximum: 2, description: '반영 후 개인 보온 보정값' }

    WeatherReport:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        current:
          type: object
          properties:
            time: { type: string, format: date-time }
            temperature: { type: number }
            apparentTemperature: { type: number }
            precipitationProbability: { type: integer }
            windSpeed: { type: number, description: 'km/h' }
            condition: { $ref: '#/components/schemas/WeatherCondition' }
        hourly:
          type: array
          description: 현재 시각부터 24시간
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              temperature: { type: number }
              apparentTemperature: { type: number }
              precipitationProbability: { type: integer }
              condition: { $ref: '#/components/schemas/WeatherCondition' }
        daily:
          type: array
          description: 오늘부터 7일
          items: { $ref: '#/components/schemas/DailyWeather' }
    DailyWeather:
      type: object
      properties:
        date: { type: string, format: date }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        temperatureMin: { type: number }
        temperatureMax: { type: number }
        apparentMin: { type: number }
        apparentMax: { type: number }
        precipitationProbabilityMax: { type: integer }

    EventInput:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        externalId: { type: [string, 'null'], description: '구글 캘린더 event id (동기화 시 필수)' }
        title: { type: string, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'], maxLength: 200 }
    EventAnalysis:
      type: object
      properties:
        tpo: { $ref: '#/components/schemas/Tpo' }
        formality: { type: integer, minimum: 1, maximum: 5 }
        dressCode: { type: [string, 'null'], example: '하객 세미정장' }
        avoidColors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        indoor: { type: [boolean, 'null'] }
        activityLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        importance: { type: integer, minimum: 1, maximum: 5, description: '높을수록 그날 코디에서 우선한다' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, enum: [AI, RULE, SEED] }
        clarifyQuestion: { type: [string, 'null'], description: "신뢰도가 낮을 때 사용자에게 물을 질문. 예: '북한산은 등산 일정인가요?'" }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: [string, 'null'] }
        title: { type: string, description: 마스킹된 제목 }
        location: { type: [string, 'null'], description: 마스킹된 장소 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        analysis: { $ref: '#/components/schemas/EventAnalysis' }

    OutfitSlot:
      type: string
      enum: [TOP, BOTTOM, DRESS, OUTER, SHOES]
    Outfit:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              slot: { $ref: '#/components/schemas/OutfitSlot' }
              item: { $ref: '#/components/schemas/Clothing' }
        warmth: { type: integer, description: '조합 보온 점수(1~5)' }
    DayPlan:
      type: object
      properties:
        date: { type: string, format: date }
        tpo: { $ref: '#/components/schemas/Tpo' }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              tpo: { $ref: '#/components/schemas/Tpo' }
        weather: { oneOf: [{ $ref: '#/components/schemas/DailyWeather' }, { type: 'null' }] }
        requiredWarmth: { type: integer, minimum: 1, maximum: 5 }
        outfit: { oneOf: [{ $ref: '#/components/schemas/Outfit' }, { type: 'null' }], description: '조합을 만들 수 없으면 null' }
        reason: { type: string, example: '토요일 결혼식이라 흰색을 피해 네이비 셔츠를 골랐어요.' }
        layeringTip: { type: [string, 'null'], example: '아침 3℃, 낮 14℃라 낮에 벗을 수 있는 가디건을 더했어요.' }
        warnings: { type: array, items: { type: string } }
    LaundryTask:
      type: object
      properties:
        itemIds: { type: array, items: { type: string, format: uuid } }
        itemNames: { type: array, items: { type: string } }
        deadline: { type: string, format: date-time, description: '이 시각까지 세탁을 시작해야 그날 마른다' }
        forDate: { type: string, format: date }
        reason: { type: string }
    WeekPlan:
      type: object
      properties:
        startDate: { type: string, format: date }
        days: { type: array, items: { $ref: '#/components/schemas/DayPlan' } }
        laundryTasks: { type: array, items: { $ref: '#/components/schemas/LaundryTask' } }
        conflicts: { type: array, items: { type: string }, description: '마감이 이미 지나 세탁이 불가능한 경우 등' }
        aiAvailable: { type: boolean, description: 'false 면 설명이 규칙 템플릿 문장이다' }
        explanationPending: { type: boolean, description: 'true 면 코디는 확정이고 설명만 규칙 문장이다. 서버가 AI 설명을 만드는 중이라 몇 초 뒤 다시 조회하면 채워진다' }

    EvaluationCheck:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        ok: { type: boolean }
        message: { type: string }
    OutfitEvaluation:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        grade: { type: string, enum: [GREAT, GOOD, FAIR, POOR] }
        checks:
          type: object
          properties:
            weather: { $ref: '#/components/schemas/EvaluationCheck' }
            tpo: { $ref: '#/components/schemas/EvaluationCheck' }
            color: { $ref: '#/components/schemas/EvaluationCheck' }
            laundry: { $ref: '#/components/schemas/EvaluationCheck' }
        summary: { type: string }
        suggestions:
          type: array
          items:
            type: object
            properties:
              replaceItemId: { type: [string, 'null'], format: uuid, description: '바꿀 옷. 옷을 더하라는 제안이면 null' }
              withItemId: { type: [string, 'null'], format: uuid, description: '대신 입을 내 옷. 옷장에 대안이 없으면 null' }
              reason: { type: string }
        warnings: { type: array, items: { type: string }, description: '세탁 필요·수선 중 등 입기 전에 확인할 사항' }
        aiAvailable: { type: boolean, description: 'false 면 summary 가 규칙 템플릿 문장이다' }

    SimilarCheckResult:
      type: object
      properties:
        attributes: { $ref: '#/components/schemas/ClothingSuggestion' }
        verdict: { type: string, enum: [DUPLICATE, SIMILAR, NEW], description: '거의 같은 옷 보유, 비슷한 옷 보유, 새로운 옷' }
        matches:
          type: array
          description: 유사도 높은 순 최대 3개
          items: { $ref: '#/components/schemas/SimilarMatch' }
        pairableCount: { type: integer, description: '이 옷과 함께 입을 수 있는 내 옷 수' }
        comment: { type: string }
    SimilarMatch:
      type: object
      properties:
        item: { $ref: '#/components/schemas/Clothing' }
        similarity: { type: number, minimum: 0, maximum: 1 }
        reasons: { type: array, items: { type: string }, example: ['같은 셔츠', '색 일치: 네이비'] }

    LookBox:
      type: object
      description: '사진 전체를 가로 1, 세로 1로 볼 때 이 옷이 있는 사각형. x, y 는 왼쪽 위 모서리'
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0.05, maximum: 1 }
        h: { type: number, minimum: 0.05, maximum: 1 }
    LookPiece:
      type: object
      properties:
        index: { type: integer, description: '카드 순서 번호' }
        productName: { type: [string, 'null'], maxLength: 80, example: '울 혼방 싱글 브레스티드 롱코트' }
        brandGuess: { type: [string, 'null'], description: '로고나 뚜렷한 특징으로 알아본 브랜드. 모르면 null' }
        spec: { type: [string, 'null'], example: '무릎 아래 기장, 노치드 라펠, 단추 2개' }
        box: { $ref: '#/components/schemas/LookBox' }
        attributes: { $ref: '#/components/schemas/ClothingSuggestion' }
        searchQuery: { type: [string, 'null'], maxLength: 80 }
        duplicate:
          oneOf:
            - $ref: '#/components/schemas/SimilarMatch'
            - type: 'null'
          description: '옷장에 거의 같은 옷이 있을 때만 값이 있다'
    LookResult:
      type: object
      properties:
        pieces: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/LookPiece' }, description: '겉옷, 상의(또는 원피스), 하의, 신발 순서' }
        aiAvailable: { type: boolean, description: 'false 면 AI 분석에 실패했다. pieces 는 빈 배열이다' }

    AvatarPaint:
      type: object
      properties:
        svg: { type: [string, 'null'], description: '캐릭터 캔버스(viewBox) 기준 SVG. AI 가 못 그렸으면 null' }
        aiAvailable: { type: boolean, description: 'AI 가 그린 그림(미리 그려 둔 데모 그림 포함)이면 true' }

    AiUsageTotals:
      type: object
      properties:
        calls: { type: integer }
        failures: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
    AiUsageReport:
      type: object
      properties:
        since: { type: string, format: date-time, description: '집계를 시작한 시각(서버 기동 시각)' }
        total: { $ref: '#/components/schemas/AiUsageTotals' }
        byFeature:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AiUsageTotals' }
          description: '기능 이름(호출한 클래스 이름)별 합계. 예: PlanExplainer, ProductFinder'
        recent:
          type: array
          description: 최근 호출 30건, 최신 순
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              feature: { type: string }
              model: { type: string }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              millis: { type: integer }
              ok: { type: boolean }

    FindCategory:
      type: string
      enum: [TOP, BOTTOM, OUTER, VEST, SHOES]
      description: '아바타 합성 위치. VEST·TOP·OUTER 는 몸통, BOTTOM 은 하체, SHOES 는 발'
    FindItem:
      type: object
      properties:
        name: { type: string }
        price: { type: integer, description: '원. 검색 시점 가격' }
        mall: { type: string, example: '무신사' }
        url: { type: string, format: uri, description: '상품 상세 페이지. 웹 검색 결과에 실제로 있던 주소만 남긴다' }
        reason: { type: string, example: '폴로 감성 그대로, 가격은 1/9' }
        size: { type: string, example: '정사이즈' }
        category: { $ref: '#/components/schemas/FindCategory' }
        imageUrl: { type: [string, 'null'], format: uri, description: '상품 페이지 og:image. 무신사 등 서버 요청을 막는 곳은 null' }
        cutoutUrl: { type: [string, 'null'], format: uri, description: '배경 제거 이미지. 아직 지원하지 않아 항상 null' }
    FindResult:
      type: object
      properties:
        analysis: { type: [string, 'null'], description: '사진·텍스트를 어떻게 읽었는지 한 줄' }
        searchQuery: { type: [string, 'null'] }
        original:
          oneOf:
            - type: object
              properties:
                name: { type: string }
                price: { type: [integer, 'null'] }
            - type: 'null'
          description: '원본 제품. 특정하지 못하면 null'
        items: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/FindItem' } }
        fallbackLinks: { type: array, items: { $ref: '#/components/schemas/MallLink' }, description: '쇼핑몰 검색 링크. 검색어가 있으면 항상 채운다' }
        aiAvailable: { type: boolean, description: 'false 면 AI 호출이 실패했거나 웹 검색을 쓸 수 없는 설정이다. items 는 빈 배열이다' }
        warnings: { type: array, items: { type: string } }
        elapsedMs: { type: integer }
    ShoppingMall:
      type: string
      enum: [MUSINSA, ZIGZAG, CM29, WCONCEPT, ELEVENST]
    SortOrder:
      type: string
      enum: [PRICE_ASC, POPULAR]
    MallLink:
      type: object
      properties:
        mall: { $ref: '#/components/schemas/ShoppingMall' }
        mallName: { type: string, example: '무신사' }
        sort: { $ref: '#/components/schemas/SortOrder' }
        sortLabel: { type: string, example: '낮은 가격순', description: '화면에 그대로 보여 줄 정렬 이름' }
        url: { type: string, format: uri, description: '해당 쇼핑몰의 검색 결과 주소' }
    ShoppingResult:
      type: object
      properties:
        attributes: { oneOf: [{ $ref: '#/components/schemas/ClothingSuggestion' }, { type: 'null' }], description: '사진 분석 결과. 검색어로 요청하면 null' }
        query: { type: string, example: '네이비 울 롱코트' }
        links: { type: array, items: { $ref: '#/components/schemas/MallLink' } }
